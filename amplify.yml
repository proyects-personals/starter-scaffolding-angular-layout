version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Environment info
        - echo "Node version:"
        - node -v
        - echo "NPM version:"
        - npm -v

        # Install dependencies
        - echo "Installing dependencies..."
        - npm install

    build:
      commands:
        # Static analysis
        - echo "Running ESLint..."
        - npm run lint

        # Format validation
        - echo "Checking Prettier format..."
        - npm run format:check

        # Unit tests with coverage
        - echo "Running Jest tests..."
        - npm run test:coverage -- --watch=false --ci --passWithNoTests

        # Angular production build
        - echo "Building Angular application..."
        - npm run build -- --configuration production

  artifacts:
    baseDirectory: dist/starter-scaffolding-angular/browser
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .angular/cache/**/*
      - ~/.npm/**/*

  customHeaders:
    - pattern: '**/*'
      headers:
        # Security headers
        - key: 'X-Frame-Options'
          value: 'DENY'

        - key: 'X-Content-Type-Options'
          value: 'nosniff'

        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'

        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'

        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'

        # Angular SPA caching strategy
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'

  environment:
    variables:
      CI: 'true'
      NODE_ENV: 'production'