version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "======================================="
        - echo "AMPLIFY GEN 2 BACKEND PIPELINE"
        - echo "======================================="

        - echo "Node version:"
        - node -v

        - echo "NPM version:"
        - npm -v

        # Faster npm installs
        - npm config set fund false
        - npm config set audit false
        - npm config set progress false

        # Install dependencies using cache
        - echo "Installing backend dependencies..."
        - npm install --cache .npm --prefer-offline --no-audit --no-fund

    build:
      commands:
        - echo "======================================="
        - echo "DEPLOYING AMPLIFY GEN 2 BACKEND"
        - echo "======================================="

        # Type validation without failing pipeline
        - npx ampx sandbox --once --outputs-format json || true

        # Deploy backend resources
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .amplify/**/*
      - .angular/cache/**/*
      - ~/.npm/**/*

frontend:
  phases:
    preBuild:
      commands:
        - echo "======================================="
        - echo "ANGULAR FRONTEND PIPELINE"
        - echo "======================================="

        - echo "Node version:"
        - node -v

        - echo "NPM version:"
        - npm -v

        # Faster npm behavior
        - npm config set fund false
        - npm config set audit false
        - npm config set progress false

        # Faster dependency installation
        - echo "Installing frontend dependencies..."
        - npm install --cache .npm --prefer-offline --no-audit --no-fund

    build:
      commands:
        # Angular cache optimization
        - export NG_BUILD_CACHE=1

        # Lint validation
        - echo "Running ESLint..."
        - npm run lint

        # Format validation
        - echo "Checking Prettier formatting..."
        - npm run format:check

        # Faster Jest CI execution
        - echo "Running Jest tests..."
        - npm run test:coverage -- --watch=false --ci --maxWorkers=50% --passWithNoTests

        # Optimized Angular production build
        - echo "Building Angular production application..."
        - npm run build -- --configuration production

  artifacts:
    baseDirectory: dist/starter-scaffolding-angular/browser
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*
      - ~/.npm/**/*
      - node_modules/**/*
      - .angular/cache/**/*
      - .vite/**/*
      - dist/**/*

  customHeaders:
    # JS assets
    - pattern: '**/*.js'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    # CSS assets
    - pattern: '**/*.css'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    # Fonts
    - pattern: '**/*.woff2'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    # Images
    - pattern: '**/*.png'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    - pattern: '**/*.jpg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    - pattern: '**/*.svg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    # HTML no-cache
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'

    # Security headers
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'DENY'

        - key: 'X-Content-Type-Options'
          value: 'nosniff'

        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'

        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'

        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'

        - key: 'Cross-Origin-Opener-Policy'
          value: 'same-origin'

        - key: 'Cross-Origin-Resource-Policy'
          value: 'same-origin'

  environment:
    variables:
      CI: 'true'
      NODE_ENV: 'production'
      NG_CLI_ANALYTICS: 'false'
      AMPLIFY_DIFF_DEPLOY: 'false'
      NODE_OPTIONS: '--max-old-space-size=6144'