version: 1

backend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm config set fund false
        - npm config set audit false
        - npm config set progress false
        - npm install --legacy-peer-deps --cache .npm --prefer-offline --no-audit --no-fund

    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .amplify/**/*

frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm config set fund false
        - npm config set audit false
        - npm install --legacy-peer-deps --cache .npm --prefer-offline --no-audit --no-fund

    build:
      commands:
        - npm run lint
        - npm run format:check
        - npm run test:coverage -- --watch=false --ci --passWithNoTests
        - npm run build -- --configuration production

  artifacts:
    baseDirectory: dist/starter-scaffolding-angular/browser
    files:
      - "**/*"

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .angular/cache/**/*

  environment:
    variables:
      CI: "true"
      NODE_ENV: "production"
      NG_CLI_ANALYTICS: "false"
      NODE_OPTIONS: "--max-old-space-size=6144"