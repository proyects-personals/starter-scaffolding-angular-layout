version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "======================================="
        - echo "AMPLIFY GEN 2 BACKEND PIPELINE"
        - echo "======================================="

        - echo "Node version:"
        - node -v

        - echo "NPM version:"
        - npm -v

        - echo "Installing backend dependencies..."
        - npm install --cache .npm --prefer-offline

    build:
      commands:
        - echo "======================================="
        - echo "DEPLOYING AMPLIFY GEN 2 BACKEND"
        - echo "======================================="

        # Validate backend types
        - npx ampx sandbox --once --outputs-format json || true

        # Deploy backend resources
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .amplify/**/*
      - .angular/cache/**/*

frontend:
  phases:
    preBuild:
      commands:
        - echo "======================================="
        - echo "ANGULAR FRONTEND PIPELINE"
        - echo "======================================="

        - echo "Node version:"
        - node -v

        - echo "NPM version:"
        - npm -v

        # Clean install dependencies
        - echo "Installing frontend dependencies..."
        - npm install --cache .npm --prefer-offline

    build:
      commands:
        # Lint validation
        - echo "Running ESLint..."
        - npm run lint

        # Format validation
        - echo "Checking Prettier formatting..."
        - npm run format:check

        # Unit testing
        - echo "Running Jest tests..."
        - npm run test:coverage -- --watch=false --ci --passWithNoTests

        # Angular production build
        - echo "Building Angular production application..."
        - npm run build -- --configuration production

  artifacts:
    baseDirectory: dist/starter-scaffolding-angular/browser
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .angular/cache/**/*
      - .vite/**/*

  customHeaders:
    # Static assets
    - pattern: '**/*.js'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    - pattern: '**/*.css'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    - pattern: '**/*.woff2'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'

    # HTML no-cache
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'

    # Security headers
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'DENY'

        - key: 'X-Content-Type-Options'
          value: 'nosniff'

        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'

        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'

        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'

  environment:
    variables:
      CI: 'true'
      NODE_ENV: 'production'
      NG_CLI_ANALYTICS: 'false'
      AMPLIFY_DIFF_DEPLOY: 'false'