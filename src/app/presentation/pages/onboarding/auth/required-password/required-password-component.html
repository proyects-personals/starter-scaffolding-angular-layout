<div class="flex items-center justify-center p-6">
  <div
    class="w-full max-w-xl bg-neutral-900 backdrop-blur-xl border border-neutral-800 p-12 rounded-[2.5rem] shadow-2xl"
  >
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold text-white tracking-tight">Cambiar contraseña</h2>

      <p class="text-neutral-400 text-base mt-2">Configura tu nueva contraseña</p>
    </div>

    <app-error-message
      [message]="errorMessage()"
      (closed)="errorMessage.set(null)"
    ></app-error-message>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-6 mt-6">
      @if (requireUsernameInput()) {
        <div class="relative">
          <i class="pi pi-user absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500"></i>

          <input
            pInputText
            formControlName="username"
            placeholder="Usuario"
            class="w-full !py-4 !bg-neutral-950 !border-neutral-800 !text-white placeholder:text-neutral-600 !rounded-xl"
          />
        </div>
      }
      <div class="relative">
        <p-password
          formControlName="password"
          placeholder="Nueva contraseña"
          [toggleMask]="true"
          [feedback]="false"
          inputStyleClass="w-full !pl-4 !pr-12 !py-4 !bg-neutral-950 !border-neutral-800 !text-white placeholder:text-neutral-600 rounded-xl"
          [style]="{ width: '100%' }"
        />
      </div>

      <p-button
        type="submit"
        [label]="isLoading() ? 'Cargando...' : 'Confirmar'"
        [loading]="isLoading()"
        [disabled]="form.invalid || isLoading()"
        styleClass="w-full !bg-neutral-100 hover:!bg-white !border-none !py-4 !rounded-xl !font-bold !text-neutral-950 transition-all shadow-lg"
      />
    </form>
  </div>
</div>
