<div class="flex items-center justify-center p-6">
  <div
    class="w-full max-w-xl bg-neutral-900 backdrop-blur-xl border border-neutral-800 p-12 rounded-[2.5rem] shadow-2xl"
  >
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold text-white tracking-tight">Bienvenido de nuevo</h2>

      <p class="text-neutral-400 text-base mt-2">Inicia sesión en CARYAN Insights</p>
    </div>

    <app-error-message
      [message]="errorMessage()"
      (closed)="errorMessage.set(null)"
    ></app-error-message>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="grid gap-6 mt-6">
      <div class="relative">
        <i
          class="pi pi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 z-10"
        ></i>

        <input
          pInputText
          formControlName="email"
          type="email"
          placeholder="Correo electrónico"
          class="w-full !py-4 !bg-neutral-950 !border-neutral-800 !text-white placeholder:text-neutral-600 !rounded-xl"
        />
      </div>

      <div class="relative">
        <p-password
          formControlName="password"
          placeholder="Contraseña"
          [toggleMask]="true"
          [feedback]="false"
          inputStyleClass="w-full !pl-4 !pr-12 !py-4 !bg-neutral-950 !border-neutral-800 !text-white placeholder:text-neutral-600 !rounded-xl"
          [style]="{ width: '100%' }"
        >
        </p-password>
      </div>

      <p-button
        type="submit"
        [label]="isLoading() ? 'Cargando...' : 'Iniciar Sesión'"
        [loading]="isLoading()"
        [disabled]="loginForm.invalid || isLoading()"
        styleClass="w-full !bg-neutral-100 hover:!bg-white !border-none !py-4 !rounded-xl !font-bold !text-neutral-950 transition-all shadow-lg"
      />

      <div class="text-center mt-2">
        <button
          type="button"
          class="text-sm text-neutral-500 hover:text-neutral-300 transition"
          (click)="navigateForgotPassword()"
        >
          ¿Olvidaste tu contraseña?
        </button>

        <div class="mt-2 mx-auto w-24 h-px bg-neutral-700"></div>
      </div>
    </form>
  </div>
</div>
