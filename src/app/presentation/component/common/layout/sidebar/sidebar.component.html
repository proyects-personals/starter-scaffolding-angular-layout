<p-drawer [(visible)]="visible" (onHide)="handleHide()">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <p-avatar icon="pi pi-user" shape="circle" />
      <span class="font-bold text-primary">SteveenCues</span>
    </div>
  </ng-template>

  <ng-template #content>
    <div class="flex flex-col h-full">
      <ul class="list-none p-0 m-0">
        @for (item of menuItems; track item.label) {
          <li>
            <a
              pRipple
              class="flex items-center cursor-pointer p-4 border-round text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors"
            >
              <i [class]="item.icon + ' mr-2'"></i>
              <span class="font-medium">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </div>
  </ng-template>
</p-drawer>
