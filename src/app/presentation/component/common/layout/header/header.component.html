<header
  class="sticky top-0 z-50 w-full border-b border-surface-200 dark:border-surface-700 bg-surface-0/80 dark:bg-surface-900/80 backdrop-blur-md"
>
  <div class="mx-auto px-4 py-2 grid grid-cols-[auto_1fr_auto] items-center gap-4">
    <div class="flex items-center gap-3">
      <a routerLink="/" class="flex items-center gap-2">
        <span class="text-xl font-extrabold tracking-tighter text-surface-950 dark:text-white">
          STEVEENCUES
        </span>
        <span
          class="hidden sm:inline-flex text-primary text-xs font-semibold uppercase bg-primary/10 px-2 py-0.5 rounded-full"
        >
          Insights
        </span>
      </a>
    </div>

    <nav class="hidden lg:flex justify-center">
      <p-menubar [model]="items" />
    </nav>

    <div class="flex justify-end items-center">
      @if (isSignInRoute()) {
        <p-button
          label="Bienvenido"
          [text]="true"
          size="small"
          (onClick)="goToHome()"
          class="animate-fade-in"
        />
      } @else {
        <p-button
          label="Sign in"
          [text]="true"
          size="small"
          (onClick)="goToLogin()"
          class="animate-fade-in"
        />
      }
    </div>
  </div>
</header>
