<header class="w-full px-4 sm:px-6">
  <div class="mx-auto max-w-7xl">
    <p-megamenu
      [model]="!isAuthenticated() ? items : []"
      styleClass="!border-0 !border-b !border-neutral-100 dark:!border-neutral-900 !bg-transparent !py-2"
    >
      <ng-template pTemplate="start">
        <a routerLink="/" class="flex items-center gap-2 no-underline group select-none mr-6">
          <span class="text-xl font-black tracking-tight text-neutral-900 dark:text-white">
            CARYAN<span class="text-neutral-400 font-light dark:text-neutral-500">.insights</span>
          </span>
        </a>
      </ng-template>

      <ng-template pTemplate="item" let-item>
        @if (item.routerLink) {
          <a
            pRipple
            [routerLink]="item.routerLink"
            class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 transition-all duration-200 no-underline"
          >
            @if (item.icon) {
              <i [class]="item.icon + ' text-xs'"></i>
            }
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <div
            pRipple
            class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-neutral-600 dark:text-neutral-400 dark:hover:text-white transition-all duration-200 cursor-pointer select-none"
          >
            @if (item.icon) {
              <i [class]="item.icon + ' text-xs'"></i>
            }
            <span>{{ item.label }}</span>
            @if (item.items) {
              <i class="pi pi-chevron-down text-[10px] ml-auto opacity-60"></i>
            }
          </div>
        }
      </ng-template>

      <ng-template pTemplate="end">
        <div class="flex items-center gap-2 sm:gap-4 ml-4">
          @if (isAuthenticated()) {
            <div
              class="flex items-center gap-2.5 bg-neutral-50 dark:bg-neutral-900/50 border border-neutral-200/40 dark:border-neutral-800/40 rounded-full pl-2 pr-3 sm:pr-4 py-1.5 transition-all"
            >
              <div
                class="relative flex h-7 w-7 sm:h-8 sm:w-8 items-center justify-center rounded-full bg-neutral-950 text-white dark:bg-white dark:text-neutral-950 text-xs font-bold shadow-sm"
              >
                <span>{{ email()?.charAt(0)?.toUpperCase() }}</span>
                <span
                  class="absolute bottom-0 right-0 h-2 w-2 rounded-full bg-emerald-500 ring-2 ring-white dark:ring-neutral-950"
                ></span>
              </div>

              <div class="flex flex-col text-left leading-none">
                <span
                  class="max-w-[90px] sm:max-w-[120px] truncate text-xs font-bold text-neutral-800 dark:text-neutral-200"
                >
                  {{ email() }}
                </span>
                <span class="text-[9px] font-medium text-neutral-400 mt-0.5"> Developer </span>
              </div>
            </div>

            <p-button
              icon="pi pi-home"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              styleClass="w-9 h-9 !text-neutral-500 dark:!text-neutral-400 hover:!bg-neutral-50 dark:hover:!bg-neutral-900 !border !border-neutral-200 dark:!border-neutral-800 active:scale-90 transition-transform"
              (onClick)="goToHome()"
            />
          } @else {
            <p-button
              label="Sign in"
              [text]="true"
              severity="secondary"
              styleClass="!text-neutral-600 dark:!text-neutral-400 hover:!text-neutral-950 dark:hover:!text-white text-sm font-bold !px-3 !py-2 !rounded-full transition-colors"
              (onClick)="goToLogin()"
            />

            <p-button
              label="Empezar"
              styleClass="!bg-neutral-950 hover:!bg-neutral-900 dark:!bg-white dark:hover:!bg-neutral-100 !text-white dark:!text-neutral-950 !border-none text-xs font-bold rounded-full px-4 sm:px-5 py-2.5 transition-all shadow-sm active:scale-95"
            />
          }
        </div>
      </ng-template>
    </p-megamenu>
  </div>
</header>
