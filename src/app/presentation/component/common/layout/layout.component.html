<div class="min-h-screen grid grid-rows-[auto_1fr_auto] bg-surface-50 dark:bg-surface-950">
  <header class="z-40">
    <app-header (onMenuClick)="toggleSidebar()"></app-header>
  </header>
  @if (isAuthenticated()) {
    <app-sidebar [(visible)]="isSidebarVisible" (onClose)="isSidebarVisible.set(false)">
    </app-sidebar>
  }
  <main
    class="grid grid-cols-4 md:grid-cols-8 lg:grid-cols-12 gap-4 p-4 md:p-8 mx-auto w-full max-w-7xl"
  >
    <div class="col-span-4 md:col-span-8 lg:col-span-12">
      <router-outlet></router-outlet>
    </div>
  </main>
  <footer class="w-full">
    <app-footer></app-footer>
  </footer>
</div>
