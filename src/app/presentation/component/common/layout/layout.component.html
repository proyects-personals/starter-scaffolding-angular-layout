<div class="min-h-screen flex flex-col bg-surface-50 dark:bg-surface-950">
  <app-header (onMenuClick)="toggleSidebar()"></app-header>

  @if (isAuthenticated()) {
    <app-sidebar [(visible)]="isSidebarVisible" (onClose)="isSidebarVisible.set(false)">
    </app-sidebar>
  }

  <main class="flex-grow flex justify-center items-start py-8">
    <div class="w-full max-w-5xl px-4">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-footer></app-footer>
</div>
