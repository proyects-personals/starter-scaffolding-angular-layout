<div
  class="flex flex-col bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-50 transition-colors duration-200"
>
  <header
    class="sticky top-0 z-40 w-full backdrop-blur bg-surface-50/80 dark:bg-surface-950/80 border-b border-surface-200/50 dark:border-surface-800/50"
  >
    <app-header (onMenuClick)="toggleSidebar()"></app-header>
  </header>

  <div class="flex-1 flex relative">
    @if (isAuthenticated()) {
      <app-sidebar
        [(visible)]="isSidebarVisible"
        (onClose)="isSidebarVisible.set(false)"
      ></app-sidebar>
    }

    <main
      [class.md:pl-64]="isAuthenticated() && isSidebarVisible()"
      class="flex-1 w-full p-4 md:p-8 transition-all duration-300 ease-in-out flex flex-col justify-center"
    >
      <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-center">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <footer class="w-full border-t border-surface-200/50 dark:border-surface-800/50 mt-auto">
    <app-footer></app-footer>
  </footer>
</div>
