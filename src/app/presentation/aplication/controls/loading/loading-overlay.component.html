@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-md transition-all duration-300"
  >
    <div
      class="flex flex-col items-center justify-center h-36 w-36 select-none transition-all duration-300"
    >
      @switch (type()) {
        @case ('spinner') {
          <p-progress-spinner strokeWidth="2.5" animationDuration="1s" styleClass="w-14 h-14" />
        }
        @case ('logo') {
          <div class="flex flex-col items-center justify-center gap-3">
            <div
              class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary text-primary-inverse text-xl font-black shadow-xl shadow-primary/30 animate-bounce"
            >
              S
            </div>
            <span
              class="text-[10px] font-bold tracking-[0.25em] uppercase text-primary animate-pulse"
            >
              Cargando...
            </span>
          </div>
        }
        @default {
          <div class="relative flex items-center justify-center h-24 w-24">
            <p-progress-spinner
              strokeWidth="2"
              animationDuration="1.6s"
              styleClass="w-full h-full text-primary"
            />
          </div>
        }
      }
    </div>
  </div>
}
